name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test og bygg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer
        run: npm ci

      - name: Format
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Enhetstester
        run: npm test

      - name: Bygg
        run: npm run build
